[pylithapp.metadata]
base = [pylithapp.cfg, sheartraction_rate.cfg]
keywords = [tetrahedral cells]
arguments = [sheartraction_rate.cfg, sheartraction_rate_tet.cfg]

[pylithapp.problem]
defaults.name = sheartraction_rate_tet


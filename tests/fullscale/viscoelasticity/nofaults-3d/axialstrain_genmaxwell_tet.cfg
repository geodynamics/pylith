[pylithapp.metadata]
base = [pylithapp.cfg, axialstrain_genmaxwell.cfg]
keywords = [tetrahedral cells]
arguments = [axialstrain_genmaxwell.cfg, axialstrain_genmaxwell_tet.cfg]

[pylithapp.problem]
defaults.name = axialstrain_genmaxwell_tet

# ----------------------------------------------------------------------
# mesh_generator
# ----------------------------------------------------------------------
[pylithapp.problem.mesh_initializer.phases.read_mesh]
reader.filename = mesh_tet.exo



[pylithapp.metadata]
base = [pylithapp.cfg, dofconstrained.cfg]
keywords = [tetraahedral cells]
arguments = [dofconstrained.cfg, dofconstrained_tet.cfg]

[pylithapp.problem]
defaults.name = dofconstrained_tet

# ----------------------------------------------------------------------
# mesh_generator
# ----------------------------------------------------------------------
[pylithapp.problem.mesh_initializer.phases.read_mesh.reader]
filename = fivecells_tet.mesh



[pylithapp.metadata]
base = [pylithapp.cfg, dofconstrained.cfg]
keywords = [hexahedral cells]
arguments = [dofconstrained.cfg, dofconstrained_hex.cfg]

[pylithapp.problem]
defaults.name = dofconstrained_hex

# ----------------------------------------------------------------------
# mesh_generator
# ----------------------------------------------------------------------
[pylithapp.problem.mesh_initializer.phases.read_mesh.reader]
filename = onecell_hex.mesh



[pylithapp.metadata]
base = [pylithapp.cfg, gravity_incompressible.cfg]
keywords = [tetrahedral cells]
arguments = [gravity_incompressible.cfg, gravity_incompressible_tet.cfg]

[pylithapp.problem]
defaults.name = gravity_incompressible_tet


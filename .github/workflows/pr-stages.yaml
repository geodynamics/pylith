name: run-ci

concurrency:
  group: ${{ github.actor }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main

jobs:
  stage-1:
    uses: ./.github/workflows/pr-stage-1.yaml
  stage-2:
    uses: ./.github/workflows/pr-stage-2.yaml
    needs: [stage-1]
  conda:
    uses: ./.github/workflows/pr-conda.yaml
    needs: [stage-1]

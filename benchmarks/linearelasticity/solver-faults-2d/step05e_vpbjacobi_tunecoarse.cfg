[pylithapp.metadata]
arguments = [step05_vpbjacobi_tunecoarse.cfg, step05e_vpbjacobi_tunecoarse.cfg]

[pylithapp.problem]
defaults.name = step05e_vpbjacobi_tunecoarse

[pylithapp.petsc]
log_view = :logs/step05e_vpbjacobi_tunecoarse.py:ascii_info_detail

[pylithapp.problem.mesh_initializer.phases.refine_mesh]
refiner.levels = 4

[pylithapp.problem.scales]
length_scale = 0.0625*km
displacement_scale = 0.0625*km

[pylithapp.petsc]
ksp_atol = 16.0e-10
snes_atol = 64.0e-10


# End of file
